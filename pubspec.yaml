name: violet_expense_tracker
description: "A personal expense tracker mobile application built with Flutter and GetX."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  
  # UI Icons
  cupertino_icons: ^1.0.8
  
  # State Management, Routing, and Dependency Injection
  get: ^4.6.6
  
  # Local Storage 
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Dashboard Pie Chart 
  fl_chart: ^0.66.0
  
  # Formatting Dates and Currency
  intl: ^0.19.0
  
  # Generating Unique IDs for Offline Storage
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended Lints
  flutter_lints: ^6.0.0
  
  # Code Generation for Hive (TypeAdapters)
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  # Ensures Material Icons font is included
  uses-material-design: true